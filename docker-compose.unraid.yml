services:
  backend:
    image: pdxmas-backend:latest
    container_name: pdxmas-backend
    ports:
      - "3001:3001"
    volumes:
      - /mnt/user/appdata/contest-app/data:/app/data
      - /mnt/user/appdata/contest-app/uploads:/app/uploads
    environment:
      - NODE_ENV=production
      - PORT=3001
    restart: unless-stopped
    networks:
      - pdxmas-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  frontend:
    image: pdxmas-frontend:latest
    container_name: pdxmas-frontend
    ports:
      - "3099:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pdxmas-network
    environment:
      - REACT_APP_API_URL=http://YOUR-UNRAID-IP:3001/api
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

networks:
  pdxmas-network:
    driver: bridge
    name: pdxmas-network
