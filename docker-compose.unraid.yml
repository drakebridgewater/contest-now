services:
  backend:
    build: ./backend
    container_name: pdxmas-backend
    ports:
      - "3001:3001"
    volumes:
      - /mnt/user/appdata/contest-app/data:/app/data
      - /mnt/user/appdata/contest-app/uploads:/app/uploads
    environment:
      - NODE_ENV=production
      - PORT=3001
      - BASE_URL=${BASE_URL:-http://localhost:3099}
      - DATABASE_PATH=/app/data/contest.db
    restart: unless-stopped
    networks:
      - pdxmas-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_ADMIN_PASSWORD: ${REACT_APP_ADMIN_PASSWORD:-pdxmas2025}
    container_name: pdxmas-frontend
    ports:
      - "3099:80"
    restart: unless-stopped
    networks:
      - pdxmas-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

networks:
  pdxmas-network:
    driver: bridge
    name: pdxmas-network
