server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Phone photos are compressed in the browser first, but leave headroom.
    client_max_body_size 20M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Look `api` up through Docker's DNS on each request (cached 10s), not once at
    # start-up: a recreated API container gets a new IP, and a name fixed at boot
    # keeps pointing at the old one (502 until this container restarts). The API
    # listens on IPv4 only, so skip its IPv6 address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    # proxy_pass with a variable re-resolves; without a URI part it forwards the
    # request URI unchanged, so /api/... and /uploads/... keep their paths.
    set $api_upstream http://api:3001;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        client_max_body_size 20M;
    }

    location /uploads/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 7d;
    }

    # Hashed assets never change under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Theme fonts: fixed names, but they change only with a new release.
    location /fonts/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Written at container start from THEME, so it can change without a new build.
    location = /theme.css {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Client-side routes (/submit, /vote, /admin) resolve to the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
